<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VueApp - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                VueApp
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">
                            Products
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sales.html">
                            Sales
                        </a>
                    </li>
                </ul>
                <div class="d-flex gap-2">
                    <a href="login.html" class="btn btn-outline-light">
                        Login
                    </a>
                    <a href="register.html" class="btn btn-primary">
                        Register
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="mb-4">
            <h1>Products</h1>
            <p class="text-muted">
                Add and manage your products.
            </p>
        </div>
        <!-- ADD PRODUCT FORM -->
        <div class="card shadow-sm mb-5">
            <div class="card-header">
                <h5 class="mb-0">Add New Product</h5>
            </div>
            <div class="card-body">
                <form>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">
                                Product Name
                            </label>
                            <input type="text" class="form-control" placeholder="e.g. Sugar">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">
                                Buying Price
                            </label>
                            <input type="number" class="form-control" placeholder="e.g. 120">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">
                                Selling Price
                            </label>
                            <input type="number" class="form-control" placeholder="e.g. 170">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Add Product
                    </button>
                </form>
            </div>
        </div>
        <!-- PRODUCT TABLE -->
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0">Product List</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product Name</th>
                                <th>Buying Price</th>
                                <th>Selling Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>Sugar</td>
                                <td>KSh 120</td>
                                <td>KSh 170</td>
                                <td>
                                    <button class="btn btn-sm btn-warning">
                                        Edit
                                    </button>
                                    <button class="btn btn-sm btn-danger">
                                        Delete
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>Milk</td>
                                <td>KSh 80</td>
                                <td>KSh 120</td>
                                <td>
                                    <button class="btn btn-sm btn-warning">
                                        Edit
                                    </button>
                                    <button class="btn btn-sm btn-danger">
                                        Delete
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
