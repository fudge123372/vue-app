<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VueApp - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                VueApp
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">
                            Products
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sales.html">
                            Sales
                        </a>
                    </li>
                </ul>
                <div class="d-flex gap-2">
                    <a href="login.html" class="btn btn-outline-light">
                        Login
                    </a>
                    <a href="register.html" class="btn btn-primary">
                        Register
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <div id="app">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-header text-center">
                            <h3>Create Account</h3>
                        </div>
                        <div class="card-body">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label">
                                        Full Name
                                    </label>
                                    <input type="text" class="form-control" placeholder="Enter your full name" v-model="full_name" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">
                                        Email Address
                                    </label>
                                    <input type="email" class="form-control" placeholder="Enter your email" v-model="email" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">
                                        Phone Number
                                    </label>
                                    <input type="tel" class="form-control" placeholder="Enter your phone number" v-model="phone">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">
                                        Password
                                    </label>
                                    <input type="password" class="form-control" placeholder="Create a password"
                                        v-model="password" required >
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">
                                        Confirm Password
                                    </label>
                                    <input type="password" class="form-control" placeholder="Confirm your password"
                                        required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    Create Account
                                </button>
                            </form>
                            <p class="text-center mt-3 mb-0">
                                Already have an account?
                                <a href="login.html">
                                    Login
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script>
        new Vue({
            el: "#app",
            data: {
                full_name: "",
                email: "",
                phone: "",
                password: ""
            }
        })
    </script>
</body>
</html>
