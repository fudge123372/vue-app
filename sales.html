<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VueApp - Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                VueApp
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">
                            Products
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="sales.html">
                            Sales
                        </a>
                    </li>
                </ul>
                <div class="d-flex gap-2">
                    <a href="login.html" class="btn btn-outline-light">
                        Login
                    </a>
                    <a href="register.html" class="btn btn-primary">
                        Register
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="mb-4">
            <h1>Sales</h1>
            <p class="text-muted">
                Record and view your sales.
            </p>
        </div>
        <!-- RECORD SALE -->
        <div class="card shadow-sm mb-5">
            <div class="card-header">
                <h5 class="mb-0">
                    Record New Sale
                </h5>
            </div>
            <div class="card-body">
                <form>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">
                                Product
                            </label>
                            <select class="form-select">
                                <option selected>
                                    Select product
                                </option>
                                <option>
                                    Sugar
                                </option>
                                <option>
                                    Milk
                                </option>
                                <option>
                                    Bread
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">
                                Quantity
                            </label>
                            <input type="number" class="form-control" min="1" placeholder="Enter quantity">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">
                                Payment Method
                            </label>
                            <select class="form-select">
                                <option selected>
                                    Select payment method
                                </option>
                                <option>
                                    Cash
                                </option>
                                <option>
                                    M-Pesa
                                </option>
                                <option>
                                    Card
                                </option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">
                        Record Sale
                    </button>
                </form>
            </div>
        </div>
        <!-- SALES TABLE -->
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0">
                    Sales History
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product</th>
                                <th>Quantity</th>
                                <th>Payment</th>
                                <th>Total</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>Sugar</td>
                                <td>5</td>
                                <td>M-Pesa</td>
                                <td>KSh 850</td>
                                <td>29/09/2026</td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>Milk</td>
                                <td>10</td>
                                <td>Cash</td>
                                <td>KSh 1,200</td>
                                <td>29/09/2026</td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>Bread</td>
                                <td>8</td>
                                <td>Card</td>
                                <td>KSh 800</td>
                                <td>28/09/2026</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
